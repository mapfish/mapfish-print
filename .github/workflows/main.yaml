name: Continuous integration

on:
  push:
    branches:
      - master
      - '[0-9]+.[0-9]+'
    tags:
      - '*'
  pull_request:

permissions:
  packages: write
  actions: write
  contents: write

  id-token: write
env:
  HAS_SECRETS: ${{ secrets.HAS_SECRETS }}

jobs:
  main:
    name: Continuous integration
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    steps:
      - run: docker system prune --all --force
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: python3 -m pip install --requirement=ci/requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --color=always
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      - name: Print environment information
        run: c2cciutils-env

      - name: Get tag
        id: tag2
        uses: frabert/replace-string-action@b6828c5a4cb6371753ff873b0d1c4c4fbd9a63cb # v2.5
        with:
          pattern: refs/tags/(.*)
          string: '{{ github.ref }}'
          replace-with: $1
        if: startsWith(github.ref, 'refs/tags/')
      - run: echo --${{ steps.tag2.outputs.replaced }}--

      - run: echo "${{ secrets.CI_GPG_PRIVATE_KEY }}" > CI.asc
        if: env.HAS_SECRETS == 'HAS_SECRETS'

      - id: tag
        run: echo "tag=$(echo ${{ github.ref }}|sed 's%refs/tags/%%g')" >> $GITHUB_OUTPUT
        if: startsWith(github.ref, 'refs/tags/')
      - run: sed --in-place 's/version=.*/version=${{ steps.tag.outputs.tag }}/g' gradle.properties
        if: startsWith(github.ref, 'refs/tags/')

      - id: last-tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
        if: "!startsWith(github.ref, 'refs/tags/')"
      - id: no-tag
        run: echo "nb=$(git log --oneline ${{ steps.last-tag.outputs.tag }}..HEAD|wc -l)" >> $GITHUB_OUTPUT
        if: "!startsWith(github.ref, 'refs/tags/')"
      - run: sed --in-place 's/version=.*/version=${{ steps.last-tag.outputs.tag }}/g' gradle.properties
        if: "!startsWith(github.ref, 'refs/tags/') && steps.no-tag.outputs.nb == 0"
      - run:
          sed --in-place 's/version=.*/version=${{ steps.last-tag.outputs.tag }}+${{ steps.no-tag.outputs.nb
          }}/g' gradle.properties
        if: "!startsWith(github.ref, 'refs/tags/') && steps.no-tag.outputs.nb > 0"
      - id: date
        run: echo "date=$(date +%Y%m%d.%H%M%S)" >> $GITHUB_OUTPUT
        if: github.ref == 'refs/heads/master'
      - run: sed --in-place 's/version=.*/version=0.${{ steps.date.outputs.date }}.SNAPSHOT/g' gradle.properties
        if: github.ref == 'refs/heads/master'

      - run: sed --in-place 's/enablePublishing=false/enablePublishing=true/g' gradle.properties
        if: env.HAS_SECRETS == 'HAS_SECRETS'
      - run: git diff

      - run: make build

      - run: make checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Checkstyle and SpotBugs reports
          path: reports
          if-no-files-found: ignore
        if: always()

      - timeout-minutes: 10
        run: make tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unit test results
          path: core/build/resources/test/org/mapfish/print/
          if-no-files-found: ignore
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unit test report
          path: core/build/reports/tests/test/
          if-no-files-found: ignore
        if: always()

      - name: Start the acceptance tests composition
        run: make acceptance-tests-up
      - name: Run the acceptance tests
        run: make acceptance-tests-run
        timeout-minutes: 6 # Add a timeout to catch performance regressions
      - run: c2cciutils-docker-logs || true
        if: always()
      - name: Stop the acceptance tests composition
        run: make acceptance-tests-down

      - name: Start the acceptance tests composition (cluster)
        run: make acceptance-tests-up
        env:
          DOCKER_COMPOSE_ARGS: --file=docker-compose-cluster.yaml
      - name: Run the acceptance tests (cluster)
        run: make acceptance-tests-run
        timeout-minutes: 6 # Add a timeout to catch performance regressions
        env:
          DOCKER_COMPOSE_ARGS: --file=docker-compose-cluster.yaml
          MAPFISH_PRINT_TESTS_CLUSTER_MODE: 'true'
      - run: c2cciutils-docker-logs || true
        if: always()
      - name: Stop the acceptance tests composition (cluster)
        run: make acceptance-tests-down
        env:
          DOCKER_COMPOSE_ARGS: --file=docker-compose-cluster.yaml

      - name: Start the acceptance tests composition (context path)
        run: make acceptance-tests-up
        env:
          DOCKER_COMPOSE_ARGS: --file=docker-compose-context-path.yaml
      - name: Run the acceptance tests (context path)
        run: make acceptance-tests-run-context-path
        timeout-minutes: 6 # Add a timeout to catch performance regressions
        env:
          DOCKER_COMPOSE_ARGS: --file=docker-compose-context-path.yaml
      - run: c2cciutils-docker-logs || true
        if: always()
      - name: Stop the acceptance tests composition (context path)
        run: make acceptance-tests-down
        env:
          DOCKER_COMPOSE_ARGS: --file=docker-compose-context-path.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Acceptance tests (Examples)
          path: examples/build/resources/test/examples/
          if-no-files-found: ignore
        if: failure()

      - run: git stash
        if: always()
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        if: env.HAS_SECRETS == 'HAS_SECRETS'
      - name: Publish
        run: tag-publish
        if: env.HAS_SECRETS == 'HAS_SECRETS'
        env:
          GITHUB_TOKEN: ${{ secrets.CAMPTOCAMP_PUBLISH_GITHUB_TOKEN }}
      - run: git diff --exit-code --patch > /tmp/dpkg-versions.patch; git diff --color; git reset --hard || true
        if: failure()
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Update dpkg versions list.patch
          path: /tmp/dpkg-versions.patch
          retention-days: 1
        if: failure()
      - run: git stash pop

      - run: >
          docker run --rm --env=GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }} mapfish_print_builder
          bash -c 'gradle publish'
        if:
          ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) && env.HAS_SECRETS ==
          'HAS_SECRETS'

      - id: version
        run: echo "version=$(grep version gradle.properties|sed "s/version=\(.*\)/\1/g")" > $GITHUB_OUTPUT
      - run: echo "${{ steps.version.outputs.version }}"
      - run: make dist

      - name: Create the release with its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |-
          set -eu
          mkdir --parents /tmp/release
          cp "./core/build/libs/print-servlet-${RELEASE_VERSION}.war" /tmp/release/
          cp "./core/build/distributions/core-${RELEASE_VERSION}.zip" "/tmp/release/print-cli-${RELEASE_VERSION}.zip"
          cp "./core/build/libs/print-lib-${RELEASE_VERSION}.jar" /tmp/release/
          cp "./core/build/libs/print-lib-${RELEASE_VERSION}-sources.jar" /tmp/release/
          cp "./core/build/libs/print-lib-${RELEASE_VERSION}-javadoc.jar" /tmp/release/
          # `gh release create` creates the release as a draft, uploads the assets and only then publishes
          # it, and deletes the draft if an upload fails. This is what release immutability requires: the
          # assets of a published release cannot be added, replaced nor removed anymore.
          gh release create "${RELEASE_TAG}" --title="${RELEASE_TAG}" /tmp/release/*
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_SECRETS == 'HAS_SECRETS'

        # Update the documentation
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mapfish/mapfish-print-doc
          token: ${{ secrets.DOC_GITHUB_TOKEN }}
          path: mapfish-print-doc
        if: github.ref == 'refs/heads/master' && env.HAS_SECRETS == 'HAS_SECRETS'
      - name: Extract the documentation
        run: |
          docker run --rm --detach --name=doc mapfish_print_builder
          cd ${GITHUB_WORKSPACE}/mapfish-print-doc
          git config user.email "ci@camptocamp.com"
          git config user.name "CI"
          git rm --ignore-unmatch -rqf .
          docker cp doc:/src/docs/build/site/. .
          git add -A .
          git commit -m 'Update docs'
        if: github.ref == 'refs/heads/master' && env.HAS_SECRETS == 'HAS_SECRETS'
      - name: Publish the documentation
        run: |
          cd ${GITHUB_WORKSPACE}/mapfish-print-doc
          git push origin gh-pages
        if: github.ref == 'refs/heads/master' && env.HAS_SECRETS == 'HAS_SECRETS'

      - name: Trigger changelog workflow
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |-
            if (process.env.GITHUB_REF_TYPE == 'tag') {
                console.log('Trigger changelog');
                await github.rest.repos.createDispatchEvent({
                    owner: 'mapfish',
                    repo: 'mapfish-print',
                    event_type: 'changelog',
                });
            }
